[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-lab-house-prices"
version = "1.0.0"
description = "Hands-on End-to-End MLOps Lab for House Price Prediction"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MLOps Lab Team" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "UP035", # Deprecated import typing
]

[tool.ruff.lint.isort]
known-first-party = ["src", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

