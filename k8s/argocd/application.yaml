apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-lab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mdrakibislam68/mlopsdemo2.git
    targetRevision: v2
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-lab
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

