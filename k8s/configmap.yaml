apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-config
  namespace: mlops-lab
data:
  PROJECT_NAME: "mlops-lab-house-prices"
  ENVIRONMENT: "kubernetes-kind"
  AWS_DEFAULT_REGION: "us-east-1"
  MINIO_DVC_BUCKET: "dvc-store"
  MINIO_MLFLOW_BUCKET: "mlflow-artifacts"
  MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  MODEL_NAME: "house-price-predictor"
  MODEL_LOCAL_PATH: "/app/models/full_pipeline.joblib"
  REFERENCE_DATA_PATH: "/app/data/raw/housing.csv"

