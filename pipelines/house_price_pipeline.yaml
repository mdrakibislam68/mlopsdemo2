# PIPELINE DEFINITION
# Name: house-price-prediction-pipeline
# Description: End-to-End MLOps pipeline on Kubeflow: Data Gen -> Validate -> Preprocess -> Train & Evaluate
# Inputs:
#    n_estimators: int [Default: 100.0]
#    num_samples: int [Default: 5000.0]
#    random_state: int [Default: 42.0]
#    test_size: float [Default: 0.2]
components:
  comp-generate-data-op:
    executorLabel: exec-generate-data-op
    inputDefinitions:
      parameters:
        num_samples:
          defaultValue: 5000.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        random_state:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        output_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-preprocess-op:
    executorLabel: exec-preprocess-op
    inputDefinitions:
      artifacts:
        raw_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        random_state:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        test_size:
          defaultValue: 0.2
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        preprocessor_artifact:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-and-evaluate-op:
    executorLabel: exec-train-and-evaluate-op
    inputDefinitions:
      artifacts:
        preprocessor_artifact:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        n_estimators:
          defaultValue: 100.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        random_state:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        trained_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
  comp-validate-data-op:
    executorLabel: exec-validate-data-op
    inputDefinitions:
      artifacts:
        input_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-generate-data-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_data_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.0.0'\
          \ 'numpy>=1.24.0'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.18.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_data_op(\n    output_dataset: Output[Dataset],\n   \
          \ num_samples: int = 5000,\n    random_state: int = 42,\n) -> None:\n  \
          \  \"\"\"Generate synthetic housing dataset.\"\"\"\n    import numpy as\
          \ np\n    import pandas as pd\n\n    np.random.seed(random_state)\n    area\
          \ = np.random.uniform(400, 4500, size=num_samples)\n    bedrooms = np.random.randint(1,\
          \ 6, size=num_samples)\n    bathrooms = np.random.choice([1.0, 1.5, 2.0,\
          \ 2.5, 3.0, 4.0], size=num_samples)\n    age = np.random.uniform(1, 50,\
          \ size=num_samples)\n    garage = np.random.choice([0, 1, 2, 3], size=num_samples,\
          \ p=[0.2, 0.4, 0.3, 0.1])\n    locations = np.random.choice([\"suburb\"\
          , \"downtown\", \"rural\"], size=num_samples, p=[0.5, 0.3, 0.2])\n\n   \
          \ loc_multipliers = {\"suburb\": 1.0, \"downtown\": 1.35, \"rural\": 0.8}\n\
          \    loc_effect = np.array([loc_multipliers[loc] for loc in locations])\n\
          \n    base_price = (\n        (area * 140.0)\n        + (bedrooms * 20000.0)\n\
          \        + (bathrooms * 15000.0)\n        + (garage * 12000.0)\n       \
          \ - (age * 1200.0)\n    )\n    noise = np.random.normal(0, 12000.0, size=num_samples)\n\
          \    price = np.clip((base_price * loc_effect) + noise, 35000.0, 3000000.0)\n\
          \n    df = pd.DataFrame(\n        {\n            \"area\": np.round(area,\
          \ 2),\n            \"bedrooms\": bedrooms,\n            \"bathrooms\": bathrooms,\n\
          \            \"location\": locations,\n            \"age\": np.round(age,\
          \ 1),\n            \"garage\": garage,\n            \"price\": np.round(price,\
          \ 2),\n        }\n    )\n    df.to_csv(output_dataset.path, index=False)\n\
          \    print(f\"Generated {len(df)} samples into {output_dataset.path}\")\n\
          \n"
        image: python:3.11-slim
    exec-preprocess-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocess_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.0.0'\
          \ 'scikit-learn>=1.3.0' 'joblib>=1.3.0'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.18.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocess_op(\n    raw_dataset: Input[Dataset],\n    train_dataset:\
          \ Output[Dataset],\n    test_dataset: Output[Dataset],\n    preprocessor_artifact:\
          \ Output[Model],\n    test_size: float = 0.2,\n    random_state: int = 42,\n\
          ) -> None:\n    \"\"\"Split data and fit preprocessing pipeline.\"\"\"\n\
          \    import joblib\n    import pandas as pd\n    from sklearn.compose import\
          \ ColumnTransformer\n    from sklearn.model_selection import train_test_split\n\
          \    from sklearn.preprocessing import OneHotEncoder, StandardScaler\n\n\
          \    df = pd.read_csv(raw_dataset.path)\n    train_df, test_df = train_test_split(df,\
          \ test_size=test_size, random_state=random_state)\n\n    train_df.to_csv(train_dataset.path,\
          \ index=False)\n    test_df.to_csv(test_dataset.path, index=False)\n\n \
          \   num_cols = [\"area\", \"bedrooms\", \"bathrooms\", \"age\", \"garage\"\
          ]\n    cat_cols = [\"location\"]\n\n    transformer = ColumnTransformer(\n\
          \        transformers=[\n            (\"num\", StandardScaler(), num_cols),\n\
          \            (\"cat\", OneHotEncoder(drop=\"first\", sparse_output=False),\
          \ cat_cols),\n        ],\n        remainder=\"drop\",\n    )\n    X_train\
          \ = train_df.drop(columns=[\"price\"])\n    transformer.fit(X_train)\n\n\
          \    joblib.dump(transformer, preprocessor_artifact.path)\n    print(f\"\
          Preprocessed train: {len(train_df)}, test: {len(test_df)} -> {preprocessor_artifact.path}\"\
          )\n\n"
        image: python:3.11-slim
    exec-train-and-evaluate-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_and_evaluate_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.0.0'\
          \ 'scikit-learn>=1.3.0' 'joblib>=1.3.0'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.18.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_and_evaluate_op(\n    train_dataset: Input[Dataset],\n\
          \    test_dataset: Input[Dataset],\n    preprocessor_artifact: Input[Model],\n\
          \    trained_model: Output[Model],\n    metrics: Output[Metrics],\n    n_estimators:\
          \ int = 100,\n    random_state: int = 42,\n) -> None:\n    \"\"\"Train RandomForestRegressor,\
          \ evaluate on test set, and emit native KFP metrics.\"\"\"\n    import joblib\n\
          \    import numpy as np\n    import pandas as pd\n    from sklearn.ensemble\
          \ import RandomForestRegressor\n    from sklearn.metrics import mean_absolute_error,\
          \ mean_squared_error, r2_score\n    from sklearn.pipeline import Pipeline\n\
          \n    train_df = pd.read_csv(train_dataset.path)\n    test_df = pd.read_csv(test_dataset.path)\n\
          \    preprocessor = joblib.load(preprocessor_artifact.path)\n\n    X_train\
          \ = train_df.drop(columns=[\"price\"])\n    y_train = train_df[\"price\"\
          ]\n    X_test = test_df.drop(columns=[\"price\"])\n    y_test = test_df[\"\
          price\"]\n\n    full_pipeline = Pipeline([\n        (\"preprocessor\", preprocessor),\n\
          \        (\"regressor\", RandomForestRegressor(n_estimators=n_estimators,\
          \ random_state=random_state)),\n    ])\n\n    full_pipeline.fit(X_train,\
          \ y_train)\n    preds = full_pipeline.predict(X_test)\n\n    rmse = float(np.sqrt(mean_squared_error(y_test,\
          \ preds)))\n    mae = float(mean_absolute_error(y_test, preds))\n    r2\
          \ = float(r2_score(y_test, preds))\n\n    # Log metrics directly into Kubeflow\
          \ Pipelines Dashboard\n    metrics.log_metric(\"R2_Score\", round(r2, 4))\n\
          \    metrics.log_metric(\"RMSE\", round(rmse, 2))\n    metrics.log_metric(\"\
          MAE\", round(mae, 2))\n\n    print(f\"==================================================\"\
          )\n    print(f\"  MODEL EVALUATION METRICS:\")\n    print(f\"  R2 Score\
          \ (Accuracy): {r2:.4f} ({r2 * 100:.2f}%)\")\n    print(f\"  RMSE       \
          \        : {rmse:,.2f}\")\n    print(f\"  MAE                : {mae:,.2f}\"\
          )\n    print(f\"==================================================\")\n\n\
          \    joblib.dump(full_pipeline, trained_model.path)\n    print(f\"Saved\
          \ trained full pipeline to {trained_model.path}\")\n\n"
        image: python:3.11-slim
    exec-validate-data-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - validate_data_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.0.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef validate_data_op(\n    input_dataset: Input[Dataset],\n) -> None:\n\
          \    \"\"\"Validate data schema, column types, and sanity ranges.\"\"\"\n\
          \    import pandas as pd\n\n    df = pd.read_csv(input_dataset.path)\n \
          \   required = [\"area\", \"bedrooms\", \"bathrooms\", \"location\", \"\
          age\", \"garage\", \"price\"]\n    for col in required:\n        assert\
          \ col in df.columns, f\"Missing required column: {col}\"\n\n    assert (df[\"\
          area\"] > 0).all(), \"Area must be positive\"\n    assert (df[\"price\"\
          ] > 0).all(), \"Price must be positive\"\n    assert set(df[\"location\"\
          ].unique()).issubset({\"suburb\", \"downtown\", \"rural\"})\n    print(f\"\
          Dataset validation passed for {len(df)} rows.\")\n\n"
        image: python:3.11-slim
pipelineInfo:
  description: 'End-to-End MLOps pipeline on Kubeflow: Data Gen -> Validate -> Preprocess
    -> Train & Evaluate'
  name: house-price-prediction-pipeline
root:
  dag:
    tasks:
      generate-data-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-data-op
        inputs:
          parameters:
            num_samples:
              componentInputParameter: num_samples
            random_state:
              componentInputParameter: random_state
        taskInfo:
          name: generate-data-op
      preprocess-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-preprocess-op
        dependentTasks:
        - generate-data-op
        - validate-data-op
        inputs:
          artifacts:
            raw_dataset:
              taskOutputArtifact:
                outputArtifactKey: output_dataset
                producerTask: generate-data-op
          parameters:
            random_state:
              componentInputParameter: random_state
            test_size:
              componentInputParameter: test_size
        taskInfo:
          name: preprocess-op
      train-and-evaluate-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-and-evaluate-op
        dependentTasks:
        - preprocess-op
        inputs:
          artifacts:
            preprocessor_artifact:
              taskOutputArtifact:
                outputArtifactKey: preprocessor_artifact
                producerTask: preprocess-op
            test_dataset:
              taskOutputArtifact:
                outputArtifactKey: test_dataset
                producerTask: preprocess-op
            train_dataset:
              taskOutputArtifact:
                outputArtifactKey: train_dataset
                producerTask: preprocess-op
          parameters:
            n_estimators:
              componentInputParameter: n_estimators
            random_state:
              componentInputParameter: random_state
        taskInfo:
          name: train-and-evaluate-op
      validate-data-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-validate-data-op
        dependentTasks:
        - generate-data-op
        inputs:
          artifacts:
            input_dataset:
              taskOutputArtifact:
                outputArtifactKey: output_dataset
                producerTask: generate-data-op
        taskInfo:
          name: validate-data-op
  inputDefinitions:
    parameters:
      n_estimators:
        defaultValue: 100.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      num_samples:
        defaultValue: 5000.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      random_state:
        defaultValue: 42.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      test_size:
        defaultValue: 0.2
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.18.0
