project:
  name: house-price-prediction
  random_state: 42

dataset:
  name: california_housing
  target_column: MedHouseVal
  feature_columns:
    - MedInc
    - HouseAge
    - AveRooms
    - AveBedrms
    - Population
    - AveOccup
    - Latitude
    - Longitude
  data_home: null
  export_csv_path: data/california_housing.csv

preprocessing:
  test_size: 0.2
  random_state: 42
  imputer_strategy: median
  scale_features: true

models:
  linear_regression:
    fit_intercept: true

  decision_tree:
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42

  random_forest:
    n_estimators: 100
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2
    n_jobs: -1
    random_state: 42

evaluation:
  primary_metric: rmse

output:
  model_dir: models
  model_filename: model.pkl
  metadata_filename: model_metadata.json

